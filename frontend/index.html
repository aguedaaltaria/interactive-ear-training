<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Auditivo Interactivo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="tarjeta-entrenamiento">
        <h1>Entrenamiento Auditivo</h1>
        <p>Haz clic en los botones para escuchar diferentes notas musicales:</p>
        
        <div class="contenedor-botones">
            <button id="boton-do" data-frecuencia="261.63">Nota Do (C4)</button>
            <button id="boton-mi" data-frecuencia="329.63">Nota Mi (E4)</button>
            <button id="boton-sol" data-frecuencia="392.00">Nota Sol (G4)</button>
        </div>
    </div>

    <!-- Vinculamos nuestro script de JavaScript modular -->
    <script src="js/audio.js"></script>
</body>
</html>
