<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Auditivo Interactivo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="tarjeta-juego">
        <h2>Entrenamiento Auditivo</h2>
        <p>Escucha la nota secreta e intenta adivinar cuál es:</p>
        
        <div id="marcador-puntaje" class="puntaje-badge">Puntaje Total: <span>0</span> pts</div>
    
        <button id="boton-reto">Escuchar Nota Secreta</button>
        
        <p id="mensaje-estado" class="mensaje-neutro">Haz clic en "Escuchar Nota Secreta" para comenzar.</p>
    
        <div class="contenedor-botones">
            <button class="boton-nota" data-nota="Do" data-frecuencia="261.63">Nota Do (C4)</button>
            <button class="boton-nota" data-nota="Re" data-frecuencia="293.66">Nota Re (D4)</button>
            <button class="boton-nota" data-nota="Mi" data-frecuencia="329.63">Nota Mi (E4)</button>
            <button class="boton-nota" data-nota="Fa" data-frecuencia="349.23">Nota Fa (F4)</button>
            <button class="boton-nota" data-nota="Sol" data-frecuencia="392.00">Nota Sol (G4)</button>
            <button class="boton-nota" data-nota="La" data-frecuencia="440.00">Nota La (A4)</button>
            <button class="boton-nota" data-nota="Si" data-frecuencia="493.88">Nota Si (B4)</button>
            <button class="boton-nota" data-nota="Do Alto" data-frecuencia="523.25">Nota Do Alto (C5)</button>
        </div>

        <div class="seccion-historial">
            <h3>Últimos Puntajes</h3>
            <ul id="lista-historial">
                <li>Cargando historial...</li>
            </ul>
        </div>
    </div>

    <script src="js/audio.js"></script>
</body>
</html>
